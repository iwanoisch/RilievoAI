[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Proxy API calls to the Netlify Function
[[redirects]]
  from = "/api/anthropic/v1/messages"
  to = "/.netlify/functions/anthropic-proxy"
  status = 200

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
