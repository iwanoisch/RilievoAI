[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Proxy API calls to the Netlify Function - MUST be before SPA fallback
[[redirects]]
  from = "/api/anthropic/*"
  to = "/.netlify/functions/anthropic-proxy"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
